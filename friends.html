<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>好友同玩 · 房间设置</title><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="viewport.css"></head><body data-page="friends"><div class="friends-shell"><header class="lobby-header"><a href="lobby.html">← 返回大厅</a><h1>好友同玩</h1><a href="profile.html#recentGames">对局战绩</a></header><main class="friends-layout"><aside><strong>经典双升</strong><p>四人对家<br>两副扑克牌</p><span>亮主 · 拖拉机 · 甩牌</span></aside><form id="roomSettings" class="room-settings"><span class="kicker">邀上好友，同桌打牌</span><h2>设置你的好友房</h2><fieldset><legend>游戏局数</legend><div class="rule-options"><label><input type="radio" name="rounds" value="0" checked>打到 A</label><label><input type="radio" name="rounds" value="4">4 局</label><label><input type="radio" name="rounds" value="8">8 局</label><label><input type="radio" name="rounds" value="20">20 局</label></div><small>达到所选局数或完成 A 级牌时，整场结束。</small></fieldset><fieldset><legend>起始级牌</legend><label class="level-choice">双方从 <select name="level" id="startLevel" aria-label="起始级牌"></select> 开始</label></fieldset><fieldset><legend>出牌时限</legend><div class="rule-options"><label><input type="radio" name="seconds" value="15">15 秒</label><label><input type="radio" name="seconds" value="30" checked>30 秒</label><label><input type="radio" name="seconds" value="60">60 秒</label></div><small>超时自动出牌；庄家埋底使用相同时限。</small></fieldset><div class="fixed-rules"><span>首局抢主坐庄</span><span>80 分上台</span><span>逆时针出牌</span><span>8 张底牌</span></div><div class="room-settings-actions"><button class="gold-button" id="confirmCreate">创建房间</button><button type="button" id="openJoin">加入房间</button></div><p id="settingsStatus" role="status"></p></form></main></div><dialog id="joinDialog"><button type="button" class="close" id="closeJoin" aria-label="关闭">×</button><h2>加入好友房</h2><form id="joinFriends"><label for="friendCode">六位房间号</label><input id="friendCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><p>加入后使用房主设置的规则。</p><button class="gold-button">加入牌桌</button></form></dialog><script src="friends.js"></script><script src="viewport.js"></script></body></html>
