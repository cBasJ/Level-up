<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的资料 · 畅玩升级</title><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="viewport.css"></head><body data-page="profile">
<div class="portal-shell profile-shell"><header class="portal-header"><a class="profile-back" href="lobby.html" aria-label="返回大厅">← 返回</a><a class="brand" href="lobby.html"><span class="brand-cards">♠<i>♥</i></span><span>畅玩升级<small>经典双升 · 对家同心</small></span></a><nav><a href="profile.html" aria-current="page">个人资料</a></nav></header>
<main class="profile-layout"><section class="profile-card"><span class="kicker">牌桌上的你</span><h1>个人资料</h1><form id="profileForm"><div class="profile-identity"><span id="profileAvatar" class="portrait avatar-0"></span><div><strong id="profileName">新牌友</strong><small id="playerId">保存后创建你的玩家身份</small></div></div><fieldset><legend>选择头像</legend><div id="avatarOptions" class="avatar-options"><button type="button" data-avatar="0" aria-label="狐狸头像" aria-pressed="true"><span class="portrait avatar-0"></span></button><button type="button" data-avatar="1" aria-label="猫咪头像" aria-pressed="false"><span class="portrait avatar-1"></span></button><button type="button" data-avatar="2" aria-label="小鸭头像" aria-pressed="false"><span class="portrait avatar-2"></span></button><button type="button" data-avatar="3" aria-label="熊猫头像" aria-pressed="false"><span class="portrait avatar-3"></span></button></div></fieldset><label for="editName">昵称</label><input id="editName" maxlength="16" placeholder="输入 1–16 字昵称" required><label for="editBio">个性签名</label><textarea id="editBio" maxlength="80" rows="2" placeholder="比如：有好牌，更要有好队友"></textarea><button id="saveProfile" class="gold-button">保存资料</button><p class="muted">资料与当前浏览器的玩家身份绑定。</p></form></section>
<section class="record-panel"><div class="section-title"><div><span class="kicker">每一局，都算数</span><h2>我的联网战绩</h2></div><a href="lobby.html">去打牌 →</a></div><div class="stat-grid"><div><strong id="gamesPlayed">0</strong><span>完成局数</span></div><div><strong id="gamesWon">0</strong><span>获胜局数</span></div><div><strong id="winRate">—</strong><span>胜率</span></div></div><h3>最近对局</h3><div id="recentGames" class="recent-games"><div class="empty-record"><span>♧</span><p>还没有完成的联网牌局</p><small>邀好友打一局，第一份战绩就从这里开始。</small></div></div><p class="muted">战绩来自服务器结算，不包含单机练习。</p></section></main><footer>和好队友，打好每一张牌。</footer></div><p id="portalToast" role="status" aria-live="polite"></p><script src="portal.js"></script><script src="viewport.js"></script></body></html>
